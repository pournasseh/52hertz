name: Create verified release

on:
  push:
    paths:
      - ".release/READY"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact clean target
        shell: bash
        run: |
          set -euo pipefail
          git checkout "21f6ef9c5953e16cc27f611546d9f664f1155719"
          python tools/build-release.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v1.0.0-rc.3" \
            "dist/52hertz-1.0.0-rc.3.zip" \
            "dist/52hertz-1.0.0-rc.3.zip.sha256" \
            --target "21f6ef9c5953e16cc27f611546d9f664f1155719" \
            --title "52Hertz 1.0.0-rc.3" \
            --notes "Release candidate for the full self-hosted 52Hertz station manager." \
            --prerelease
