name: Publish verified source

on:
  push:
    paths:
      - ".transfer/READY"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, gd
          coverage: none

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "3927262e4408dbc3401324330ea3fdde0370ed3d7c2b2aff0713f900ab8e0fd1  /tmp/source.zip" | sha256sum --check -

      - name: Replace staging tree without modifying this workflow
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name publish.yml -exec rm -rf {} +
          unzip -q /tmp/source.zip -d .

      - name: Verify candidate
        shell: bash
        run: |
          node --test tests/*.test.mjs
          php tests/media-tools.test.php
          php tests/public.test.php
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish 52Hertz 1.0.0-rc.3"
          git push

      - name: Prove release build
        run: python tools/build-release.py
